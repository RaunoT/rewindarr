<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>You are offline | Rewindarr</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #000;
        color: #fff;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      main {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .card {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 24rem;
        flex-direction: column;
        align-items: center;
        border-radius: 1.5rem;
        padding: 1.25rem;
        text-align: center;
        background-color: rgb(255 255 255 / 3%);
        background-image: linear-gradient(
          to bottom,
          rgb(255 255 255 / 4%),
          transparent 40%
        );
        box-shadow:
          inset 0 1px 0 0 rgb(255 255 255 / 10%),
          0 24px 48px -24px rgb(0 0 0 / 70%);
        backdrop-filter: blur(40px) saturate(150%);
      }

      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        pointer-events: none;
        background: linear-gradient(
          150deg,
          rgb(255 255 255 / 28%),
          rgb(255 255 255 / 6%) 30%,
          rgb(255 255 255 / 3%) 70%,
          rgb(255 255 255 / 12%)
        );
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }

      .badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 1rem;
        border-radius: 9999px;
        background-color: rgb(255 255 255 / 5%);
        color: #d4d4d4;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 10%);
      }

      .badge svg {
        width: 1.5rem;
        height: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .actions {
        display: flex;
        width: 100%;
        flex-direction: column;
        margin-top: 2rem;
      }

      .button,
      .button:visited {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background-color: #fff;
        padding: 0.625rem 1.5rem;
        font-weight: 600;
        color: #000;
        text-decoration: none;
        transition:
          background-color 200ms,
          transform 200ms;
      }

      .button:hover {
        background-color: #e5e5e5;
      }

      .button:active {
        transform: scale(0.98);
      }

      .button:focus-visible {
        outline: 2px solid #e5e5e5;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }

        .button:active {
          transform: none;
        }
      }
    </style>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="badge" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m3 3 8.735 8.735m0 0a.374.374 0 1 1 .53.53m-.53-.53.53.53m0 0L21 21M14.652 9.348a3.75 3.75 0 0 1 0 5.304m2.121-7.425a6.75 6.75 0 0 1 0 9.546m2.121-11.667c3.808 3.807 3.808 9.98 0 13.788m-9.546-4.242a3.733 3.733 0 0 1-1.06-2.122m-1.061 4.243a6.75 6.75 0 0 1-1.625-6.929m-.496 9.05c-3.068-3.067-3.664-7.67-1.79-11.334M12 12h.008v.008H12V12Z"
            />
          </svg>
        </div>
        <h1 id="offline-title">You are offline</h1>
        <div class="actions">
          <a id="offline-retry" href="" class="button">Try again</a>
        </div>
      </div>
    </main>
  </body>
</html>
